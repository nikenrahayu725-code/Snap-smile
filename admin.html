<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Snap & Smile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0e7;color:#3c2928;font-family:Arial,sans-serif}main{max-width:760px;margin:28px auto;padding:16px}.card{background:#fffaf2;border:1px solid #e7d6c4;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #55332212}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{color:#762f37}label{display:flex;gap:10px;align-items:center;padding:9px 0}input[type=password],input[type=text]{width:100%;padding:12px;border:1px solid #cbb7a3;border-radius:9px;font-size:16px}button{border:0;border-radius:10px;background:#762f37;color:white;padding:12px 18px;font-size:15px;cursor:pointer;margin-top:8px}.muted{color:#76675d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}#status{margin:12px 0;color:#762f37;white-space:pre-wrap}
</style></head><body><main><h1>Snap & Smile</h1><p class="muted">Panel Admin · Niken & Egit</p>
<section class="card" id="loginBox"><h2>Login Admin</h2><label style="display:block">Password admin<input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password admin"></label><button id="login">Masuk</button></section>
<section class="hidden" id="settings">
<div class="card"><h2>Jumlah Foto</h2><div class="grid" id="photoCounts"><label><input type="checkbox" value="1"> 1 foto</label><label><input type="checkbox" value="2"> 2 foto</label><label><input type="checkbox" value="3"> 3 foto</label><label><input type="checkbox" value="4"> 4 foto</label></div></div>
<div class="card"><h2>Countdown</h2><div class="grid" id="countdowns"><label><input type="checkbox" value="3"> 3 detik</label><label><input type="checkbox" value="5"> 5 detik</label><label><input type="checkbox" value="0"> Tanpa countdown</label></div></div>
<div class="card"><h2>Filter</h2><div class="grid" id="filters"><label><input type="checkbox" value="none"> Natural</label><label><input type="checkbox" value="warm"> Warm</label><label><input type="checkbox" value="soft"> Korean Soft</label><label><input type="checkbox" value="vintage"> Vintage</label><label><input type="checkbox" value="mono"> Hitam putih</label></div></div>
<div class="card"><h2>Frame</h2><div class="grid" id="frames"><label><input type="checkbox" value="cream"> Cream klasik</label><label><input type="checkbox" value="pink"> Soft pink</label><label><input type="checkbox" value="dark"> Midnight</label><label><input type="checkbox" value="white"> Clean white</label><label><input type="checkbox" value="wedding"> Minang Maroon &amp; Gold</label></div></div>
<div class="card"><h2>Tulisan Frame</h2><label style="display:block">Nama / judul<input id="title" type="text" maxlength="80"></label><label style="display:block">Tanggal / subjudul<input id="subtitle" type="text" maxlength="40"></label></div>
<div class="card"><h2>Kelola Galeri Wedding</h2><p class="muted">Pilih foto yang ingin dihapus dari galeri publik.</p><div id="adminGallery" class="grid"></div><button id="refreshGallery" type="button">Muat ulang galeri</button> <button id="deleteSelected" type="button" style="background:#9b3434">Hapus pilihan</button> <button id="deleteAll" type="button" style="background:#9b3434">Hapus semua foto</button></div>
<button id="save">Simpan Pengaturan</button> <button id="logout" style="background:#76675d">Keluar</button></section><div id="status"></div></main>
<script>
const $=id=>document.getElementById(id),groups=['photoCounts','countdowns','filters','frames'];
function status(t){$('status').textContent=t}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})},credentials:'same-origin'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}
function fill(c){for(const g of groups){const vals=(c[g]||[]).map(String);document.querySelectorAll('#'+g+' input').forEach(x=>x.checked=vals.includes(x.value))}$('title').value=c.title||'THE WEDDING OF NIKEN & EGIT';$('subtitle').value=c.subtitle||'19.12.2026'}
function read(){const c={};for(const g of groups)c[g]=[...document.querySelectorAll('#'+g+' input:checked')].map(x=>x.value);c.photoCounts=c.photoCounts.map(Number);c.countdowns=c.countdowns.map(Number);c.title=$('title').value.trim();c.subtitle=$('subtitle').value.trim();return c}
async function load(){const c=await api('/api/admin/config');fill(c);$('loginBox').classList.add('hidden');$('settings').classList.remove('hidden');await loadGallery();status('Pengaturan dan galeri berhasil dimuat.')}
async function loadGallery(){const d=await api('/api/admin/gallery');const box=$('adminGallery');box.innerHTML='';if(!d.photos.length){box.textContent='Belum ada foto.';return}for(const p of d.photos){const label=document.createElement('label');label.style.cssText='display:block;background:#f4e9df;padding:8px;border-radius:10px';const cb=document.createElement('input');cb.type='checkbox';cb.value=p.fileId;const img=document.createElement('img');img.src=p.thumbnailUrl||p.url;img.style.cssText='width:100%;height:150px;object-fit:contain;display:block';const date=document.createElement('small');date.textContent=new Date(p.createdAt).toLocaleString('id-ID');label.append(cb,img,date);box.append(label)}}
async function deletePhotos(ids){if(!ids.length)return status('Pilih foto terlebih dahulu.');if(!confirm('Yakin ingin menghapus '+ids.length+' foto?'))return;try{await api('/api/admin/gallery',{method:'DELETE',body:JSON.stringify({fileIds:ids})});await loadGallery();status('Foto berhasil dihapus.')}catch(e){status(e.message)}}
$('refreshGallery').onclick=()=>loadGallery().catch(e=>status(e.message));$('deleteSelected').onclick=()=>deletePhotos([...document.querySelectorAll('#adminGallery input:checked')].map(x=>x.value));$('deleteAll').onclick=()=>deletePhotos([...document.querySelectorAll('#adminGallery input')].map(x=>x.value));
$('login').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';await load()}catch(e){status(e.message)}};
$('save').onclick=async()=>{try{const c=read();if(!c.photoCounts.length||!c.countdowns.length||!c.filters.length||!c.frames.length)throw Error('Pilih minimal satu opsi pada setiap bagian.');await api('/api/admin/config',{method:'PUT',body:JSON.stringify(c)});status('Pengaturan tersimpan dan diterapkan pada halaman umum.')}catch(e){status(e.message)}};
$('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{}$('settings').classList.add('hidden');$('loginBox').classList.remove('hidden');status('Sudah keluar.')};
(async()=>{try{await load()}catch{}})();
</script></body></html>
